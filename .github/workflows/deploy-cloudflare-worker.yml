name: Deploy Cloudflare Worker

on:
  workflow_dispatch:
  push:
    branches: [main, staging]
    paths:
      - 'apps/worker/**'
      - 'apps/liff/**'
      - 'packages/db/**'
      - 'packages/shared/**'
      - 'packages/line-sdk/**'
      - 'packages/update-engine/**'
      - '.github/workflows/deploy-cloudflare-worker.yml'

jobs:
  deploy:
    if: github.repository != 'Shudesu/line-harness-oss' && vars.LINE_HARNESS_CLOUDFLARE_DEPLOY == 'true'
    runs-on: ubuntu-latest
    env:
      DEPLOY_ENV: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @line-crm/shared --filter @line-crm/line-sdk --filter @line-crm/db --filter @line-harness/update-engine build

      - name: Run pending D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

          # 名前 (line-crm) 単独でのlookupは本番アカウント内の別DBに解決される
          # 事故が発生した (2026-08-23)。wrangler.toml の [env.production]/[env.staging]
          # に記載済みの確定IDへ、binding名 (DB) + --env で解決させ曖昧さを無くす。
          D1EX() {
            npx wrangler d1 execute DB --config apps/worker/wrangler.toml --env "$DEPLOY_ENV" --remote "$@"
          }

          D1EX --command \
            "CREATE TABLE IF NOT EXISTS _migrations (name TEXT PRIMARY KEY, applied_at TEXT NOT NULL)"

          # 1回限りの補正: 2026-08-23 の初回実行で「2026-08-23より前は反映済み」と
          # 一括シードしたが、033 は実際には未反映だった (本番のみ)。誤記録を消し
          # 下の自己修復ループで実際に再試行させる。
          D1EX --command \
            "DELETE FROM _migrations WHERE name = '033_auto_replies_template_id.sql'"

          # migrations は履歴的に `wrangler d1 execute --file` の手動運用も混在しており
          # _migrations 追跡テーブルの記録とDBの実状態がズレている場合がある。
          # 各ファイル適用時、「既に反映済みであることを示すエラー」
          # (duplicate column / already exists) の場合は反映済みとみなして
          # _migrations に記録し継続する。それ以外のエラーは本当の問題として停止する。
          for f in $(ls packages/db/migrations/*.sql | sort); do
            name=$(basename "$f")
            applied=$(D1EX --command "SELECT name FROM _migrations WHERE name = '${name}'" --json \
              | node -e "const d=JSON.parse(require('fs').readFileSync('/dev/stdin','utf8'));console.log(d[0]?.results?.length||0)")
            if [ "$applied" != "0" ]; then
              echo "Skipped (recorded): $name"
              continue
            fi

            echo "Applying: $name"
            set +e
            output=$(D1EX --file="$f" 2>&1)
            status=$?
            set -e
            echo "$output"

            if [ $status -ne 0 ]; then
              if echo "$output" | grep -qiE "duplicate column name|already exists"; then
                echo "既に反映済みとみなして記録します: $name"
              else
                echo "::error::未知のエラーで migration 失敗: $name"
                exit 1
              fi
            fi

            D1EX --command \
              "INSERT INTO _migrations (name, applied_at) VALUES ('${name}', datetime('now'))"
          done

      - name: Build Worker and LIFF assets
        run: pnpm --filter worker build
        env:
          VITE_LIFF_ID: ${{ env.DEPLOY_ENV == 'staging' && vars.VITE_LIFF_ID_STAGING || vars.VITE_LIFF_ID }}
          VITE_BOT_BASIC_ID: ${{ vars.VITE_BOT_BASIC_ID }}
          VITE_CALENDAR_CONNECTION_ID: ${{ vars.VITE_CALENDAR_CONNECTION_ID }}

      - name: Patch wrangler config
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_NAME: ${{ env.DEPLOY_ENV == 'staging' && secrets.D1_DATABASE_NAME_STAGING || secrets.D1_DATABASE_NAME }}
          D1_DATABASE_ID: ${{ env.DEPLOY_ENV == 'staging' && secrets.D1_DATABASE_ID_STAGING || secrets.D1_DATABASE_ID }}
          WORKER_NAME: ${{ env.DEPLOY_ENV == 'staging' && vars.WORKER_NAME_STAGING || vars.WORKER_NAME || 'your-worker-name' }}
          # Admin CORS config — set these as repo Variables when the admin panel
          # and the Worker API are on different origins (e.g. *.pages.dev admin
          # + *.workers.dev API). Baking them into the deployed config (vars)
          # means every deploy carries them, so they can't be silently dropped
          # the way a manually-set dashboard variable is on redeploy.
          ADMIN_ORIGIN: ${{ env.DEPLOY_ENV == 'staging' && vars.ADMIN_ORIGIN_STAGING || vars.ADMIN_ORIGIN }}
          ADMIN_ALLOW_CROSS_SITE: ${{ vars.ADMIN_ALLOW_CROSS_SITE }}
          WORKER_URL: ${{ env.DEPLOY_ENV == 'staging' && vars.WORKER_URL_STAGING || vars.WORKER_URL }}
        run: |
          test -n "$D1_DATABASE_ID"
          cd apps/worker
          sed -i \
            -e "s|\"account_id\":\"[^\"]*\"|\"account_id\":\"${CLOUDFLARE_ACCOUNT_ID}\"|g" \
            -e "s|\"database_name\":\"[^\"]*\"|\"database_name\":\"${D1_DATABASE_NAME}\"|g" \
            -e "s|\"database_id\":\"[^\"]*\"|\"database_id\":\"${D1_DATABASE_ID}\"|g" \
            dist/line_harness/wrangler.json
          # Inject admin CORS vars into the deployed config when ADMIN_ORIGIN is
          # set. ADMIN_ALLOW_CROSS_SITE defaults to "true" (SameSite=None; Secure
          # cookies) since cross-origin admin/API is the case that needs it.
          if [ -n "$ADMIN_ORIGIN" ]; then
            tmp="$(mktemp)"
            jq --arg o "$ADMIN_ORIGIN" --arg x "$ADMIN_ALLOW_CROSS_SITE" --arg w "$WORKER_URL" '
              .vars.ADMIN_ORIGIN = $o
              | .vars.ADMIN_ALLOW_CROSS_SITE = (if $x == "" then "true" else $x end)
              | (if $w != "" then .vars.WORKER_URL = $w else . end)
            ' dist/line_harness/wrangler.json > "$tmp" && mv "$tmp" dist/line_harness/wrangler.json
            echo "Patched admin CORS vars: ADMIN_ORIGIN=$ADMIN_ORIGIN ADMIN_ALLOW_CROSS_SITE=${ADMIN_ALLOW_CROSS_SITE:-true}"
          fi

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        env:
          WORKER_NAME: ${{ env.DEPLOY_ENV == 'staging' && vars.WORKER_NAME_STAGING || vars.WORKER_NAME || 'your-worker-name' }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/worker
          command: deploy --config dist/line_harness/wrangler.json --name ${{ env.WORKER_NAME }}
