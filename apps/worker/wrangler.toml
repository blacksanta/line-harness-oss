name = "line-harness"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# ═══════════════════════════════════════════════════════════════
# デフォルト = テスト環境 (noda@)
# 使い方: npx wrangler deploy
# ═══════════════════════════════════════════════════════════════
account_id = "YOUR_DEV_ACCOUNT_ID"

# Workers Cache pilot. Enabled only for the private test Worker; production is
# explicitly disabled below until cache hit rate and auth isolation are proven.
# Only routes with an explicit public Cache-Control header are eligible because
# src/middleware/cache-policy.ts marks every other response no-store.
[cache]
enabled = true

[assets]
directory = "dist/client"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "line-harness"
database_id = "YOUR_DEV_D1_DATABASE_ID"

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "line-harness-images"

# ═══════════════════════════════════════════════════════════════
# TenantScheduler DO — 定期ジョブ (配信・リマインド・insight 取得) を自走させる。
# binding name "TENANT_SCHEDULER" と class_name "TenantScheduler" は
# scripts/lib/tenant-wrangler.ts (テナント自動プロビジョニング) にも
# 同名で書く必要がある — 片方だけ変えると「デプロイは成功するが alarm は
# 一生 armed されない」という気づきにくい壊れ方をするので要注意。
# 実装: apps/worker/src/durable-objects/tenant-scheduler.ts
# ═══════════════════════════════════════════════════════════════
[[durable_objects.bindings]]
name = "TENANT_SCHEDULER"
class_name = "TenantScheduler"

# SQLite ストレージ (alarm 状態を持つ) を使う新規 DO クラスなので
# new_sqlite_classes での migration 登録が必要。
[[migrations]]
tag = "v1"
new_sqlite_classes = ["TenantScheduler"]

# Cron Trigger は引き続き残す。DO alarm と共存させる (自己ホスト環境が
# cron のみで運用を続けられるようにするため)。両方が同じ分に発火しても、
# scheduled() が呼ぶジョブ本体は元々 (6時間境界で2 trigger が同時に鳴る
# 現行構成のもと) 同時実行に耐える楽観ロック/claim パターンで書かれている。
[triggers]
crons = ["* * * * *", "0 */6 * * *"]

# ═══════════════════════════════════════════════════════════════
# Phase 5 self-update vars — consumed by /admin/update/*. Secrets
# (CF_API_TOKEN, ADMIN_API_KEY) must be set via `wrangler secret put`
# and are intentionally absent from this file.
# 注: [env.production] には意図的に置かない。本番は GitHub Actions デプロイ
# 運用のため self-update は使わず、vars/secrets 不在で route は実行時ガードで
# 不活性になる (本番挙動を変えないための判断, 2026-07-07)。
# ═══════════════════════════════════════════════════════════════
# LOG_RETENTION_DAYS: days to keep messages_log rows (archived to R2 first).
# Unset = keep forever (default). Set per-deployment, not here.
[vars]
WORKER_NAME = "line-harness"
ADMIN_PAGES_PROJECT = "line-harness-admin-134f68c9"
LIFF_PAGES_PROJECT = "line-harness-liff"
D1_DATABASE_ID = "YOUR_DEV_D1_DATABASE_ID"
MANIFEST_URL = "https://github.com/Shudesu/line-harness-oss/releases/latest/download/release-manifest.json"
WORKER_PUBLIC_URL = "https://line-harness.workers.dev"
ADMIN_PUBLIC_URL = "https://line-harness-admin.pages.dev"
LIFF_PUBLIC_URL = "https://line-harness-liff.pages.dev"
CF_ACCOUNT_ID = "YOUR_DEV_ACCOUNT_ID"

# ═══════════════════════════════════════════════════════════════
# 本番環境 (aiagent.mini@)
# 使い方: npx wrangler deploy --env production --name your-worker-name
# D1:     npx wrangler d1 execute line-crm --env production --remote --file ...
# 注: 新CI (deploy-cloudflare-worker.yml) は wrangler.toml の [env.*] を使わず、
# ビルド時生成した wrangler.json を Secrets/Vars でパッチしてデプロイする方式に
# 移行済み。以下の [env.production]/[env.staging] は手動デプロイ用として残す。
# ═══════════════════════════════════════════════════════════════
[env.production]
account_id = "fe67ee32ff09d65511ba69bfd049bef5"
compatibility_flags = ["nodejs_compat"]

[env.production.cache]
enabled = false

[env.production.assets]
directory = "dist/client"
binding = "ASSETS"

[[env.production.d1_databases]]
binding = "DB"
database_name = "line-crm"
database_id = "0a68f5ef-7ece-4b9a-9837-c3a8e87d9f6f"

[[env.production.r2_buckets]]
binding = "IMAGES"
bucket_name = "line-harness-images"

# バインディングは環境ごとに継承されないので production にも明示する。
# name / class_name はデフォルト環境と揃えること (上の注意書き参照)。
[[env.production.durable_objects.bindings]]
name = "TENANT_SCHEDULER"
class_name = "TenantScheduler"

[env.production.triggers]
crons = ["* * * * *", "0 */6 * * *"]

# ═══════════════════════════════════════════════════════════════
# Staging 環境（本番と同一 account、リソースは別）
# 使い方: npx wrangler deploy --env staging
# D1:     npx wrangler d1 execute line-crm-staging --env staging --remote --file ...
# ═══════════════════════════════════════════════════════════════
[env.staging]
name = "line-harness-staging"
account_id = "fe67ee32ff09d65511ba69bfd049bef5"

[env.staging.assets]
directory = "dist/client"
binding = "ASSETS"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "line-crm-staging"
database_id = "9841d8a6-81d8-41c2-b43b-828b9e19532d"

[[env.staging.r2_buckets]]
binding = "IMAGES"
bucket_name = "line-harness-images-staging"

[env.staging.triggers]
crons = ["* * * * *", "0 */6 * * *"]
